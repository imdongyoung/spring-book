spring:
  application:
    name: spring-4-book-blog-project
  jpa:
    # 전송 쿼리 확인
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          import_files_sql_extractor: org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
      # 테이블 생성 후에 data.sql 실행
      defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
  h2:
    console:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: client-id
            client-secret: secret-key
            scope:
              - email
              - profile
jwt:
  issuer: imdong207@gmail.com
  secret-key: study-springboot
